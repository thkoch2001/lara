[workspace]
members = ["crates/main", "crates/crawl"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["Thomas Koch <thomas@koch.ro>"]
description = "decentraliced web search engine"
homepage = "https://github.com/thkoch2001/lara"
license = "AGPL-3.0-or-later"
keywords = ["search", "crawler"]
categories = ["web-programming"]

[workspace.dependencies]
anyhow = "*"
chrono = { version = "*", default-features = false, features = [ "now" ] }
env_logger = "*"
http = "*"
log = "*"
mediatype = "*"
url = "*"