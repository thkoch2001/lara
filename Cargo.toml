[package]
name = "lara"
version = "0.0.1"
edition = "2021"
authors = ["Thomas Koch <thomas@koch.ro>"]
description = "decentraliced web search engine"
homepage = "https://github.com/thkoch2001/lara"
license = "AGPL-3.0-or-later"
keywords = ["search", "crawler"]
categories = ["web-programming"]

[dependencies]
anyhow = "*"
chrono = "*"
ctrlc = "*"
diesel = { version = "*", features = ["chrono", "postgres", "without-deprecated"], default-features = false }
diesel-derive-enum = { version = "*", features = ["postgres"] }
env_logger = "*"
flate2 = "*"
html5ever = "*"
http = "*"
itertools = "*"
log = "*"
quick-xml = "*"
simple_moving_average = "*"
texting_robots = "*"
ureq = { version = "*", features = ["brotli", "charset", "gzip", "native-tls"]}
url = "*"
uuid = { version = "*", features = ["v4"] }

[dev-dependencies]
assertables = "*"
proptest = "*"

[profile.test.package.proptest]
opt-level = 3

[profile.test.package.rand_chacha]
opt-level = 3